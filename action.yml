name: gha-ekg
description: Monitor CPU, memory, disk and network during a job and post a report to the job summary
author: ingarabr
inputs:
  interval:
    description: Sampling interval in seconds
    default: "5"
  upload-artifact:
    description: Upload the raw samples as a JSONL artifact
    default: "true"
  github-token:
    description: Token used to read step timings (needs actions read) and to create the check run (needs checks write). Empty disables both.
    default: ${{ github.token }}
  output:
    description: "Chart format in the job summary: ascii or mermaid"
    default: ascii
  report-to:
    description: "Where the report goes: summary, check (falls back to the job summary if the check run cannot be created; needs checks write), both or none"
    default: summary
runs:
  using: node24
  main: dist/main/index.mjs
  post: dist/post/index.mjs
  post-if: always()
branding:
  icon: activity
  color: red
