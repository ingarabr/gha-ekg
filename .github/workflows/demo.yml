name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, output: ascii, report-to: summary }
          - { os: ubuntu-24.04-arm, output: mermaid, report-to: check }
          - { os: macos-latest, output: mermaid, report-to: both }
          - { os: windows-latest, output: ascii, report-to: check }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          interval: 2
          output: ${{ matrix.output }}
          report-to: ${{ matrix.report-to }}
      - name: Idle
        shell: bash
        run: sleep 6
      - name: Workload (cpu, memory, disk, network)
        shell: bash
        run: node demo/workload.mjs 32
      - name: Cool down
        shell: bash
        run: sleep 6

  fallback:
    name: fallback (no checks permission)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          interval: 2
          report-to: check
      - name: Workload
        shell: bash
        run: node demo/workload.mjs 12
