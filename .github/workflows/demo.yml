name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, output: ascii }
          - { os: ubuntu-24.04-arm, output: mermaid }
          - { os: macos-latest, output: mermaid }
          - { os: windows-latest, output: ascii }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          interval: 2
          output: ${{ matrix.output }}
      - name: Idle
        shell: bash
        run: sleep 6
      - name: Workload (cpu, memory, disk, network)
        shell: bash
        run: node demo/workload.mjs 32
      - name: Cool down
        shell: bash
        run: sleep 6
